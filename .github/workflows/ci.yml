name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
      # An approved dataset produces the deterministic report twice; a pending
      # dataset fails closed. Neither branch is treated as a skipped replay.
      - name: Verify Phase 10 gate and deterministic approved report
        id: phase10
        run: |
          npm run phase10:ci | tee phase10-ci.log
          echo "approved=$(sed -n 's/^phase10-approved=//p' phase10-ci.log)" >> "$GITHUB_OUTPUT"
      - name: DuckDB Node 22 smoke
        run: npm test -- tests/integration/phase10-analytics.test.ts
      - name: Upload approved Phase 10 report
        if: steps.phase10.outputs.approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase10-sanitized-report
          path: .mastra/ci-phase10-a/
          retention-days: 7
