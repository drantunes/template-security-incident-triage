name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # The Phase 10 report validates that the immutable dataset origin commit
      # is an ancestor of HEAD. A shallow checkout cannot prove that relation.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run audit
      # An approved dataset produces the deterministic report twice; a pending
      # dataset fails closed. Neither branch is treated as a skipped replay.
      - name: Verify Phase 10 gate and deterministic approved report
        id: phase10
        shell: bash
        run: |
          set -o pipefail
          phase10_log="$RUNNER_TEMP/phase10-ci.log"
          npm run phase10:ci 2>&1 | tee "$phase10_log"
          grep -Fx "phase10-approved=true" "$phase10_log"
          echo "approved=true" >> "$GITHUB_OUTPUT"
      - name: DuckDB Node 22 smoke
        run: npm test -- tests/integration/phase10-analytics.test.ts
      - name: Upload approved Phase 10 report
        if: ${{ success() && steps.phase10.outputs.approved == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: phase10-sanitized-report
          path: .mastra/ci-phase10-a/
          retention-days: 7
